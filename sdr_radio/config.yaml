name: "SDR UKW Radio"
description: "UKW-Radioempfang mit RTL-SDR, Livestream und Home-Assistant-Wiedergabe"
version: "0.5.4"
slug: "sdr_radio"
url: "https://github.com/andreassamitsch/HausCheckHAOS/tree/main/sdr_radio"
arch:
  - amd64
  - aarch64
stage: experimental
startup: application
boot: manual
init: false
ingress: true
ingress_port: 8098
panel_icon: mdi:radio
panel_title: "SDR Radio"
panel_admin: true
ports:
  "8099/tcp": 8099
ports_description:
  "8099/tcp": "MP3-Livestream (nur Heimnetz)"
usb: true
udev: true
homeassistant_api: true
options:
  device_index: 0
  gain: "auto"
  ppm: 0
  rds_enabled: true
  audio_target_dbfs: -18
  audio_max_gain_db: 15
  stream_http_profile: "chunked"
  stream_base_url: "http://192.168.1.66:8099"
schema:
  device_index: "int(0,)"
  gain: str
  ppm: "int(-150,150)"
  rds_enabled: bool
  audio_target_dbfs: "int(-24,-12)"
  audio_max_gain_db: "int(0,20)"
  stream_http_profile: list(chunked|close)
  stream_base_url: str

services:
  - mqtt:want
