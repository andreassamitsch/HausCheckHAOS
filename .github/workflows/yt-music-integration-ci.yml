name: YouTube Music Live integration validation

on:
  pull_request:
    paths:
      - "custom_components/yt_audio_live/**"
      - ".github/workflows/yt-music-integration-ci.yml"
  push:
    branches: [main]
    paths:
      - "custom_components/yt_audio_live/**"
      - ".github/workflows/yt-music-integration-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile integration code and parse metadata
        run: |
          python -m compileall -q custom_components/yt_audio_live
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("custom_components/yt_audio_live")
          for path in root.rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
              print("Valid JSON:", path)
          manifest = json.loads((root / "manifest.json").read_text())
          assert manifest["domain"] == "yt_audio_live"
          assert manifest["config_flow"] is True
          PY
      - name: Check Python syntax and imports with Ruff
        run: |
          python -m pip install ruff
          ruff check --select E4,E7,E9,F custom_components/yt_audio_live

      - name: Package standalone integration for manual HA test
        run: |
          cd custom_components
          zip -qr "$GITHUB_WORKSPACE/yt_audio_live-integration-test.zip" yt_audio_live
      - name: Upload integration test package
        uses: actions/upload-artifact@v4
        with:
          name: yt_audio_live-integration-test
          path: yt_audio_live-integration-test.zip
          if-no-files-found: error
