name: HausCheck release guard

on:
  pull_request:
    branches: [main]
    paths:
      - "hauscheck/**"
      - "RELEASE_PROCESS.md"
      - "repository.yaml"
      - ".github/workflows/release-guard.yml"
  push:
    branches: [main]
    paths:
      - "hauscheck/**"
      - "RELEASE_PROCESS.md"
      - "repository.yaml"
      - ".github/workflows/release-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hauscheck-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hauscheck/requirements.txt

      - name: Install runtime dependencies
        run: python -m pip install -r hauscheck/requirements.txt

      - name: Read and validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path('hauscheck/config.yaml').read_text(encoding='utf-8')
          match = re.search(r'^version:\s*["\x27]?([^"\x27\s]+)', text, re.MULTILINE)
          if not match:
              raise SystemExit('version fehlt in hauscheck/config.yaml')
          print(match.group(1))
          PY
          )"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9]+)*$ ]] || {
            echo "Ungültige Versionsnummer: $VERSION" >&2
            exit 1
          }
          grep -Fq "## $VERSION" hauscheck/CHANGELOG.md || {
            echo "CHANGELOG-Abschnitt ## $VERSION fehlt" >&2
            exit 1
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release-Version: $VERSION"

      - name: Require version bump in pull requests
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1
          BASE_VERSION="$(git show "origin/${{ github.base_ref }}:hauscheck/config.yaml" | python -c "import re,sys; t=sys.stdin.read(); m=re.search(r'^version:\\s*[\"\\x27]?([^\"\\x27\\s]+)',t,re.M); print(m.group(1) if m else '')")"
          HEAD_VERSION="${{ steps.version.outputs.version }}"
          if [[ "$BASE_VERSION" == "$HEAD_VERSION" ]]; then
            echo "Die Add-on-Version wurde nicht erhöht: $HEAD_VERSION" >&2
            exit 1
          fi
          echo "Versionssprung: $BASE_VERSION → $HEAD_VERSION"

      - name: Compile Python modules
        run: python -m compileall -q hauscheck/app hauscheck/tests

      - name: Run update and mail inbox regression tests
        env:
          PYTHONPATH: hauscheck
        run: |
          python hauscheck/tests/test_supervisor_update_refresh.py
          python hauscheck/tests/test_mail_inbox_route_fix.py
          python hauscheck/tests/test_mail_inbox.py

      - name: Verify published main version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${{ steps.version.outputs.version }}"
          FOUND=""
          for attempt in $(seq 1 20); do
            FOUND="$(curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/hauscheck/config.yaml?commit=${GITHUB_SHA}&attempt=${attempt}" | python -c "import re,sys; t=sys.stdin.read(); m=re.search(r'^version:\\s*[\"\\x27]?([^\"\\x27\\s]+)',t,re.M); print(m.group(1) if m else '')" || true)"
            if [[ "$FOUND" == "$EXPECTED" ]]; then
              echo "Öffentlicher main-Stand bestätigt: $FOUND"
              exit 0
            fi
            echo "Versuch $attempt: erwartet $EXPECTED, öffentlich gefunden ${FOUND:-nichts}"
            sleep 3
          done
          echo "Der öffentliche main-Stand zeigt nach 60 Sekunden nicht Version $EXPECTED" >&2
          exit 1
