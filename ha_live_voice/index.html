<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hausassistent · Live</title>
<style>
:root{color-scheme:light dark;--bg:#edf1f5;--surface:#fff;--text:#17212b;--muted:#667383;--line:#e4e9ef;--bubble:#f0f3f7;--user:#dcecff;--accent:#176ad6;--end:#c53542;font:16px system-ui,-apple-system,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#11161e;--surface:#1c242f;--text:#edf2f8;--muted:#a9b5c3;--line:#303b48;--bubble:#293440;--user:#203e61;--accent:#71b4ff;--end:#d84955}}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--text);display:grid;place-items:center;padding:clamp(0px,2vw,20px)}
[hidden]{display:none!important}.dialog{width:min(100%,620px);height:min(100%,760px);min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:26px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 50px #0001}
header{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line);flex-shrink:0}.headtext{flex:1;min-width:0}h1{font-size:18px;font-weight:650;margin:0}.subtitle{font-size:12px;color:var(--muted);margin:3px 0 0}.avatar{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;background:var(--bubble);color:var(--accent)}
button,select{font:inherit;color:inherit}button{border:0;cursor:pointer;background:var(--bubble);border-radius:12px}button:disabled{opacity:.45;cursor:default}button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.iconbtn{width:40px;height:40px;display:grid;place-items:center;flex-shrink:0}svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#settings{padding:14px 20px;border-bottom:1px solid var(--line);flex-shrink:0;background:var(--bubble);font-size:14px}#settings label{display:flex;align-items:center;justify-content:space-between;gap:12px}select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px;max-width:65%}#login{padding:10px 14px;background:var(--accent);color:var(--surface);margin-top:8px}#device{line-height:1.6;overflow-wrap:anywhere}#device a{color:var(--accent)}code{font-size:1.2em;user-select:all}#usage{font-size:12px;color:var(--muted)}
main{flex:1;min-height:0;overflow:auto;padding:20px;overscroll-behavior:contain}.empty{height:100%;min-height:120px;display:grid;place-content:center;text-align:center;color:var(--muted);gap:8px}.empty strong{color:var(--text);font-size:18px}.message{display:flex;flex-direction:column;align-items:flex-start;margin:0 0 18px}.message.user{align-items:flex-end}.who{font-size:12px;color:var(--muted);font-weight:600;margin:0 5px 5px}.bubble{max-width:91%;white-space:pre-wrap;overflow-wrap:anywhere;padding:12px 16px;line-height:1.5;border-radius:18px 18px 18px 5px;background:var(--bubble);font-size:16px}.user .bubble{background:var(--user);border-radius:18px 18px 5px 18px}.note{font-size:12px;color:var(--muted);margin:5px 8px}
footer{padding:16px 20px max(22px,env(safe-area-inset-bottom));text-align:center;flex-shrink:0;border-top:1px solid var(--line)}.wave{height:30px;display:flex;align-items:center;justify-content:center;gap:5px;margin:0 auto 9px;color:var(--accent)}.wave i{width:5px;height:9px;border-radius:7px;background:currentColor;opacity:.5}.wave[data-mode=listen] i,.wave[data-mode=user] i,.wave[data-mode=speak] i{animation:pulse 1.1s ease-in-out infinite alternate;opacity:1}.wave i:nth-child(2n){animation-delay:-.4s}.wave i:nth-child(3n){animation-delay:-.7s}.wave[data-mode=work] i{animation:pulse 1.7s ease-in-out infinite alternate;opacity:.75}@keyframes pulse{0%{height:7px}100%{height:27px}}@media(prefers-reduced-motion:reduce){.wave i{animation:none!important}}
#status{font-weight:600;font-size:15px;min-height:22px;margin:0}.hint{min-height:19px;color:var(--muted);font-size:12px;margin:4px 0 14px}.controls{display:flex;align-items:center;justify-content:center;gap:12px}.primary{padding:13px 22px;display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--accent);color:var(--surface);border-radius:28px;font-weight:650}.end{background:var(--end);color:#fff}.secondary{padding:12px 15px;font-size:14px}
@media(max-width:600px){body{padding:0}.dialog{height:100%;width:100%;border:0;border-radius:0;box-shadow:none}main{padding:18px 16px}header{padding:14px 16px}footer{padding-top:12px}}
</style></head>
<body><section class="dialog" aria-label="Live-Sprachdialog">
<header><span class="avatar" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9h-6v-6H9v6H3z"/></svg></span><div class="headtext"><h1>Hausassistent</h1><p class="subtitle" id="voice-label">Live Voice</p></div>
<button class="iconbtn" id="settings-toggle" title="Einstellungen" aria-label="Einstellungen" aria-expanded="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2"/></svg></button>
<button class="iconbtn" id="close" title="Zurück zum Family Dashboard" aria-label="Schließen"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header>
<section id="settings" hidden><label>Stimme<select id="voice"><option>cove</option><option>juniper</option><option>maple</option><option>spruce</option><option>ember</option><option>vale</option><option>breeze</option><option>arbor</option><option>sol</option><option value="sonna">Sonna (Deutsch)</option></select></label><button id="login">ChatGPT anmelden</button><p id="device" hidden><a href="https://auth.openai.com/codex/device" target="_blank" rel="noopener noreferrer">Anmeldung öffnen</a> und Code <code id="code"></code> eingeben.</p><p id="usage"></p></section>
<main id="log" role="log" aria-live="polite"><div class="empty" id="empty"><strong>Wie kann ich dir helfen?</strong><span>Dein Gespräch erscheint hier.</span></div></main>
<footer><div class="wave" id="wave" data-mode="ready" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><p id="status" role="status">Verbindung prüfen …</p><p id="hint" class="hint"></p><div class="controls">
<button class="primary" id="start" disabled><svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2m-7 9v3m-4 0h8"/></svg>Gespräch starten</button>
<button class="secondary" id="interrupt" hidden disabled>Unterbrechen</button><button class="primary end" id="stop" hidden disabled><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>Beenden</button>
</div></footer><audio id="audio" autoplay playsinline></audio></section><script src="app.js"></script></body></html>
